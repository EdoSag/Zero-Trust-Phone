name: zerotrust_phone
description: "Zero-Trust Phone: a private dialer for Android, with names from your encrypted ZT Contacts."
publish_to: none
version: 0.4.1+6

environment:
  sdk: ^3.9.0

# Builds SQLite3MultipleCiphers instead of plain SQLite, so the core's local
# store is encrypted as a whole file (see Zero-Trust-Core README, "Sync").
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Shared account, keys, sync, settings and look of every Zero-Trust app.
  # Never add cryptography_flutter: it breaks the core's key derivation.
  zero_trust_core:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zero_trust_core
      ref: 08eccf33e5989c0efceba67d351159b979ae0740
  intl: any
  flutter_riverpod: ^3.5.0
  supabase_flutter: ^2.9.0
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.1
  share_plus: ^13.3.1
  cryptography: ^2.7.0
  timezone: ^0.11.2

dev_dependencies:
  # Release checks every Zero-Trust app runs in CI (keys, sync, sign-in, app
  # setup, database). Independent of zero_trust_core, so it may be newer.
  zt_release_checks:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_release_checks
      ref: b43fcd045722bc364ef2eaa739db181f9dac144f
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
